/* Base styles for the element that has a tooltip */

	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;

	}

	background: transparent;

<style>
  :root{--bg:#f3f5f1;--surface:#fff;--surface-2:#edf1ea;--border:#cfd6c9;--ink:#111611;--ink-2:#3f4a3f;--ink-3:#5f6b5f;
    --green:#176b63;--green-ink:#fff;--green-bg:#dcefeb;--blue:#1f5fb4;--pv:#2e8b3a;--warn:#8a5300;--warn-bg:#fdf0cf;--bad:#a82d17;--bad-bg:#fbe3dd}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input{font:inherit;color:inherit}
  button,a.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  header{background:var(--green);color:var(--green-ink);padding:14px 18px}
  header h1{margin:0;font-size:22px}
  header p{margin:2px 0 0;font-size:14px;opacity:.9}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border-bottom:2px solid var(--border);position:sticky;top:0;z-index:1000}
  .tabs button{border:2px solid var(--border);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
  .tabs button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);gap:14px;padding:14px;max-width:1500px;margin:0 auto}
  #map{height:calc(100vh - 150px);height:calc(100dvh - 150px);min-height:420px;border-radius:14px;border:2px solid var(--border);position:sticky;top:70px}
  .panel{min-width:0}
  .box{background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
  .box h2{margin:0 0 8px;font-size:19px}
  .hint{color:var(--ink-3);font-size:14px;margin:0 0 10px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 12px}
  .fld label{display:block;font-size:13px;color:var(--ink-2)}
  .fld input{width:100%;font-size:16px;-webkit-appearance:none;appearance:none;min-height:40px;border:2px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--bg)}
  .gen{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
  .gen:first-child{border-top:0}
  .gen .who{flex:1;min-width:0}
  .gen .nm{font-weight:700}
  .gen .ad{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}
  .tag.ex{background:#f1e4fb;color:#6b2c91}
  .gen.isex{background:#faf5fd;margin:0 -8px;padding:8px}
  .add{margin-top:10px;border:2px dashed var(--border);border-radius:12px;padding:10px 12px}
  .add summary{cursor:pointer;font-weight:700;color:var(--green);min-height:32px;display:flex;align-items:center}
  .add .hint{margin:6px 0 8px}
  .addrow{display:flex;gap:8px;flex-wrap:wrap}
  .addrow select{flex:1 1 220px;min-width:0;min-height:42px;font:inherit;font-size:16px;border:2px solid var(--border);border-radius:10px;padding:6px 8px;background:var(--surface)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tag.pv{background:#dff1e2;color:var(--pv)}.tag.gen{background:#e2edfb;color:var(--blue)}.tag.sd{background:var(--warn-bg);color:var(--warn)}
  .stp{display:flex;align-items:center;gap:4px}
  .stp button{width:36px;height:36px;border-radius:9px;border:2px solid var(--border);background:var(--surface);font-weight:700;font-size:18px;cursor:pointer}
  .stp input{width:52px;height:36px;font-size:16px;-moz-appearance:textfield;text-align:center;border:2px solid var(--border);border-radius:9px;font-weight:700}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:10px;border:2px solid var(--border);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
  .btn.go{background:var(--green);border-color:var(--green);color:var(--green-ink)}
  .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.sm{min-height:32px;font-size:13px;padding:0 10px;border-radius:8px}
  .btn.big{width:100%;min-height:52px;font-size:18px;margin-top:10px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .kpi{background:var(--surface-2);border-radius:10px;padding:8px 10px}
  .kpi b{display:block;font-size:20px}.kpi span{font-size:12px;color:var(--ink-3)}
  .note{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
  .note.warn{background:var(--warn-bg);border-left:5px solid var(--warn)}
  .note.err{background:var(--bad-bg);border-left:5px solid var(--bad)}
  .trip{border:2px solid var(--border);border-left-width:8px;border-radius:12px;padding:10px 12px;margin:10px 0}
  .trip h3{margin:0 0 4px;font-size:17px}
  .load{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin:6px 0 8px}
  .load i{display:block;height:100%}
  .stop{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 0}
  .num{width:30px;height:30px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
  .num.home{background:var(--ink-3)}
  .stop .t{font-weight:700}.stop .s{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
  .stop .q{font-size:13px;font-weight:700;color:var(--green)}
  .leg{margin-left:15px;padding:1px 0 1px 20px;border-left:3px dotted var(--border);color:var(--ink-3);font-size:12px}
  .legend{background:#fff;max-width:60vw;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.6;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .legend .lgh{cursor:pointer;display:block}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .pin{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  .pin.cv{width:30px;height:30px;font-size:15px;background:var(--green)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;z-index:2000}
  .toast[hidden]{display:none}
  @media (max-width:900px){.wrap{grid-template-columns:1fr;padding:10px}#map{position:relative;top:auto;height:55vh;height:55dvh;min-height:320px}.kpis{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:600px){
    header{padding:10px 14px}header h1{font-size:18px}header p{font-size:13px}
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 10px}
    .tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;padding:8px 12px}
    .stp button{width:40px;height:40px}.stp input{height:40px}
    .btn.sm{min-height:40px;font-size:14px}
    .stop{grid-template-columns:30px 1fr auto}
    .legend{font-size:12px;line-height:1.5;padding:6px 8px}.legend .lgb{display:none}.legend.open .lgb{display:block}.legend .lgh:after{content:' ▸'}.legend.open .lgh:after{content:' ▾'}
    .leaflet-control-attribution{font-size:9px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gen{flex-wrap:wrap}.gen .who{flex-basis:100%}.gen .stp{margin-left:auto}
  }
  .stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  @media print{header,.tabs,#map,#cfg,.noprint,.toast{display:none!important}.wrap{display:block;padding:0}.box,.trip{break-inside:avoid;border-color:#000}body{background:#fff}}
</style>
</head>
<body>
<header>
  <h1>Recorridos del camión · Centro Verde Guaymallén</h1>
  <p>Cooperativa Aguaribay · Plan semanal propuesto, recalculable con los bolsones del día</p>
</header>
<nav class="tabs" id="tabs" aria-label="Día"></nav>
<div class="wrap">
  <div id="map" role="region" aria-label="Mapa del recorrido"></div>
  <div class="panel">
    <section class="box" id="cfg">
      <h2 id="cfgTitle">Bolsones del día</h2>
      <p class="hint" id="cfgHint">Ajustá cuántos bolsones tiene cada lugar. Con 0 el lugar queda afuera del recorrido de hoy.</p>
      <div id="gens"></div>
      <div class="grid2" style="margin-top:12px">
        <div class="fld"><label for="pCap">Capacidad del camión (bolsones)</label><input type="number" id="pCap" min="1"></div>
        <div class="fld"><label for="pStart">Hora de salida</label><input type="time" id="pStart"></div>
        <div class="fld"><label for="pStop">Minutos por parada</label><input type="number" id="pStop" min="0"></div>
        <div class="fld"><label for="pUnload">Minutos para descargar</label><input type="number" id="pUnload" min="0"></div>
      </div>
      <button class="btn go big" id="btnPlan" type="button">Armar el recorrido</button>
      <div class="btns noprint" style="margin-top:8px"><button class="btn sm" id="btnReset" type="button">Volver a los valores de la planilla</button></div>
    </section>
    <section id="result" aria-live="polite"></section>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>

/* ---------- Planificador: un camión, varios viajes, capacidad ---------- */
function planDay(list,dem,cap){
  var T=MX.T,trips=[],rest=[];
  list.forEach(function(i){var d=dem[i];while(d>cap){trips.push({order:[i],q:{},load:cap});trips[trips.length-1].q[i]=cap;d-=cap;}if(d>0){rest.push(i);dem[i]=d;}});
  var n=rest.length;if(!n)return trips;
  var N=1<<n,INF=1e15,hk=new Float64Array(N*n).fill(INF),par=new Int32Array(N*n).fill(-1),m,j,k;
  for(j=0;j<n;j++)hk[(1<<j)*n+j]=T[0][rest[j]];
  for(m=1;m<N;m++)for(j=0;j<n;j++){if(!(m>>j&1))continue;var c=hk[m*n+j];if(c>=INF)continue;
    for(k=0;k<n;k++){if(m>>k&1)continue;var nm=m|1<<k,v=c+T[rest[j]][rest[k]];if(v<hk[nm*n+k]){hk[nm*n+k]=v;par[nm*n+k]=j;}}}
  var tc=new Float64Array(N).fill(INF),tl=new Int32Array(N),ld=new Int32Array(N),pc=new Int32Array(N);
  for(m=1;m<N;m++){for(j=0;j<n;j++)if(m>>j&1){ld[m]+=dem[rest[j]];pc[m]++;var v2=hk[m*n+j]+T[rest[j]][0];if(v2<tc[m]){tc[m]=v2;tl[m]=j;}}}
  var f=new Float64Array(N).fill(INF),ch=new Int32Array(N);f[0]=0;
  var svcU=S.p.unload*60;
  for(m=1;m<N;m++){var low=m&-m,rem=m^low,sub=rem;
    while(true){var s=sub|low;if(ld[s]<=cap){var v3=tc[s]*DEF.fact+svcU+f[m^s];if(v3<f[m]){f[m]=v3;ch[m]=s;}}if(sub===0)break;sub=(sub-1)&rem;}}
  if(f[N-1]>=INF)return null;
  m=N-1;while(m){var s2=ch[m],ord=[],cm=s2,cj=tl[s2];while(cj!==-1){ord.push(rest[cj]);var pj=par[cm*n+cj];cm&=~(1<<cj);cj=pj;}
    ord.reverse();var q={},L=0;ord.forEach(function(i){q[i]=dem[i];L+=dem[i];});trips.push({order:ord,q:q,load:L});m^=s2;}
  trips.sort(function(a,b){return MX.T[0][a.order[0]]-MX.T[0][b.order[0]];});
  return trips;
}

var CUR=null;
function run(){
  var d=day(),dem={},list=[];
  stopsOf().forEach(function(i){var b=bagsOf(i);if(b>0){dem[i]=b;list.push(i);}});
  var cap=Math.max(1,S.p.cap|0);
  var start=hm2s(d.start||S.p.start);
  if(!list.length){CUR={empty:true};render();return;}
  var capUse=(d.id==='cenco')?1e9:cap;
  var trips=planDay(list,JSON.parse(JSON.stringify(dem)),capUse);
  if(!trips){CUR={err:'No se pudo armar el recorrido con esos números.'};render();return;}
  var clock=start,totD=0,totDrive=0,totQ=0;
  trips.forEach(function(t,ti){
    t.depart=clock;var cur=0;t.stops=[];t.dist=0;t.drive=0;
    t.order.forEach(function(i){var ld=MX.T[cur][i]*DEF.fact,dd=MX.D[cur][i];clock+=ld;t.stops.push({i:i,q:t.q[i],arrive:clock,legD:dd,legT:ld});clock+=stopSec(i);t.dist+=dd;t.drive+=ld;cur=i;});
    t.backD=MX.D[cur][0];t.backT=MX.T[cur][0]*DEF.fact;t.dist+=t.backD;t.drive+=t.backT;clock+=t.backT;t.ret=clock;
    if(ti<trips.length-1)clock+=S.p.unload*60;
    totD+=t.dist;totDrive+=t.drive;totQ+=t.load;t.color=COLORS[ti%COLORS.length];
  });
  CUR={trips:trips,dist:totD,drive:totDrive,q:totQ,finish:trips[trips.length-1].ret,cap:capUse,start:start,
       sd:list.filter(function(i){return P[i].sd&&S.bags[S.day+':'+i]==null;})};
  render();
}

var baseEsri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'&copy; Esri &middot; &copy; OpenStreetMap'});
var baseGris=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Mapa &copy; Esri'});
var baseSat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imágenes &copy; Esri'});
baseEsri.addTo(map);
L.control.layers({'Calles':baseEsri,'Gris claro':baseGris,'Satélite':baseSat},null,{position:'topright'}).addTo(map);
var layer=L.layerGroup().addTo(map);
var leg=L.control({position:'bottomleft'});
leg.onAdd=function(){var d=L.DomUtil.create('div','legend');L.DomEvent.disableClickPropagation(d);d.innerHTML='<b class="lgh">Referencias</b><div class="lgb"><i style="background:#176b63"></i>Centro Verde<br><i style="background:#1f5fb4"></i>Generador<br><i style="background:#2e8b3a"></i>Punto verde<br><i style="background:#9aa39a"></i>Sin retiro hoy<br>Línea de color: recorrido por calle</div>';d.querySelector('.lgh').onclick=function(){d.classList.toggle('open');};return d;};
leg.addTo(map);
function pin(lat,lon,html,cls,bg,tip){var mk=L.marker([lat,lon],{icon:L.divIcon({className:'',html:'<div class="pin '+(cls||'')+'" style="background:'+bg+'">'+html+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}).bindPopup(tip);if(!L.Browser.mobile)mk.bindTooltip(tip);return mk;}
function drawMap(){
  layer.clearLayers();var d=day(),b=[[P[0].lat,P[0].lon]];
  pin(P[0].lat,P[0].lon,'⌂','cv','#176b63','<b>Centro Verde Guaymallén</b><br>Sale y vuelve acá').addTo(layer);
  var inRoute={};
  if(CUR&&CUR.trips){var k=0;CUR.trips.forEach(function(t){t.stops.forEach(function(s){k++;inRoute[s.i]=1;var p=P[s.i];
      pin(p.lat,p.lon,k,'',p.t==='PV'?'#2e8b3a':'#1f5fb4','<b>'+k+'. '+esc(p.n)+'</b><br>'+esc(p.a)+'<br>Retirar '+pl(s.q,'bolsón',unitOf(s.i))+' · llega ~'+fHM(s.arrive)).addTo(layer);b.push([p.lat,p.lon]);});
      drawRoute(t);});}
  stopsOf().forEach(function(i){if(!inRoute[i]){var p=P[i];pin(p.lat,p.lon,'·','','#9aa39a',esc(p.n)+' (sin retiro hoy)').addTo(layer);b.push([p.lat,p.lon]);}});
  map.fitBounds(b,{paddingTopLeft:[30,30],paddingBottomRight:[30,window.innerWidth<600?50:40],maxZoom:15});
}

function decode(str){var i=0,lat=0,lng=0,out=[];while(i<str.length){var b,sh=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);lat+=(r&1)?~(r>>1):(r>>1);sh=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);lng+=(r&1)?~(r>>1):(r>>1);out.push([lat/1e5,lng/1e5]);}return out;}
var legCache={};
function legGeom(a,b){var k=a+'-'+b;if(legCache[k])return legCache[k];if(LEGS[k])return (legCache[k]=decode(LEGS[k]));return null;}
function drawRoute(t){
  var pts=[0].concat(t.order,[0]),g=[],missing=false;
  for(var x=0;x<pts.length-1;x++){var s=legGeom(pts[x],pts[x+1]);if(s){g=g.concat(s);}else{missing=true;g.push([P[pts[x]].lat,P[pts[x]].lon],[P[pts[x+1]].lat,P[pts[x+1]].lon]);}}
  L.polyline(g,{color:'#fff',weight:8,opacity:.8}).addTo(layer);
  L.polyline(g,{color:t.color,weight:5,opacity:.9}).addTo(layer);
  if(missing)fetchRoute(t,pts);
}
function fetchRoute(t,pts){ // solo si falta algún tramo (lugar agregado a mano)
  var c=pts.map(function(i){return P[i].lon+','+P[i].lat;}).join(';');
  fetch('https://router.project-osrm.org/route/v1/driving/'+c+'?overview=full&geometries=geojson').then(function(r){return r.json();}).then(function(j){
    if(j.code!=='Ok')return;L.polyline(j.routes[0].geometry.coordinates.map(function(x){return[x[1],x[0]];}),{color:t.color,weight:5,opacity:.9}).addTo(layer);}).catch(function(){});
}

function ll(i){return P[i].lat+','+P[i].lon;}
function waze(i){return 'https://waze.com/ul?ll='+ll(i)+'&navigate=yes';}
function gmapsParts(t){ // Google Maps admite hasta 9 paradas intermedias por link
  var seq=[0].concat(t.order,[0]),parts=[],a=0;
  while(a<seq.length-1){var b=Math.min(a+10,seq.length-1),wp=seq.slice(a+1,b).map(ll).join('|');
    parts.push('https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+ll(seq[a])+'&destination='+ll(seq[b])+(wp?'&waypoints='+encodeURIComponent(wp):''));a=b;}
  return parts;
}
function dayText(){
  var d=day(),L=['Recorrido del '+d.n+' · Centro Verde Guaymallén','Sale '+fHM(CUR.start)+' · vuelve ~'+fHM(CUR.finish)+' · '+fKm(CUR.dist)];
  CUR.trips.forEach(function(t,ti){L.push('');if(CUR.trips.length>1)L.push('VIAJE '+(ti+1)+' · sale '+fHM(t.depart)+' · '+t.load+'/'+CUR.cap+' bolsones');
    t.stops.forEach(function(s,k){L.push((k+1)+') '+P[s.i].n+' ('+P[s.i].a+') · retirar '+pl(s.q,'bolsón',unitOf(s.i))+' · ~'+fHM(s.arrive));L.push('   Waze: '+waze(s.i));});
    L.push('Vuelta al Centro Verde ~'+fHM(t.ret));
    gmapsParts(t).forEach(function(u,k,a){L.push('Google Maps'+(a.length>1?' (parte '+(k+1)+')':'')+': '+u);});});
  L.push('');L.push('Horarios estimados, sin tránsito.');return L.join('\n');
}
async function copy(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true;}}catch(e){}
  var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.top='0';a.style.opacity='0';a.style.fontSize='16px';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(a);return ok;}

function addBlock(){

    '<div class="addrow"><label class="sr" for="addSel">Destino a agregar</label><select id="addSel"><option value="">Elegí un lugar…</option>'+
    grp('Generadores',function(i){return P[i].t!=='PV';})+grp('Puntos verdes',function(i){return P[i].t==='PV';})+
    '</select><button type="button" class="btn go" id="addBtn">Agregar</button></div>')+'</details>';
}
function render(){
  var el=$('#result'),d=day(),h='';
  if(!CUR){el.innerHTML='';drawMap();return;}
  if(CUR.empty){el.innerHTML='<div class="box"><div class="note warn">No hay lugares con bolsones para el '+esc(d.n)+'. Cargá al menos uno.</div></div>';drawMap();return;}
  if(CUR.err){el.innerHTML='<div class="box"><div class="note err">'+esc(CUR.err)+'</div></div>';drawMap();return;}
  h+='<div class="box"><h2>Recorrido del '+esc(d.n)+'</h2>';
  var nst=CUR.trips.reduce(function(a,t){return a+t.stops.length;},0);
  h+='<div class="kpis"><div class="kpi"><b>'+CUR.trips.length+'</b><span>'+(CUR.trips.length===1?'viaje':'viajes')+'</span></div><div class="kpi"><b>'+nst+'</b><span>paradas</span></div><div class="kpi"><b>'+fKm(CUR.dist)+'</b><span>en total</span></div><div class="kpi"><b>'+fHM(CUR.finish)+'</b><span>vuelve al Centro Verde</span></div></div>';
  if(d.id!=='cenco'&&CUR.finish>hm2s(DEF.end))h+='<div class="note warn">El camión vuelve después de las '+DEF.end+', fuera del turno. Conviene pasar algún lugar a otro día.</div>';
  if(CUR.trips.length>1&&d.id!=='feria')h+='<div class="note warn">Los bolsones superan la capacidad de '+CUR.cap+': el camión vuelve a descargar y sale de nuevo ('+pl(CUR.trips.length,'viaje','viajes')+').</div>';
  var exs=extras().filter(function(i){return bagsOf(i)>0;});if(exs.length)h+='<div class="note warn">Incluye '+pl(exs.length,'destino agregado','destinos agregados')+' de otro día: <b>'+exs.map(function(i){return esc(P[i].n);}).join(', ')+'</b>.</div>';
  if(CUR.sd.length)h+='<div class="note warn">Sin dato de bolsones para: <b>'+CUR.sd.map(function(i){return esc(P[i].n);}).join(', ')+'</b>. Se calculó con 1 por lugar.</div>';
  CUR.trips.forEach(function(t,ti){
    var pct=d.id==='cenco'?100:Math.min(100,t.load/CUR.cap*100);
    h+='<div class="trip" style="border-left-color:'+t.color+'"><h3>'+(CUR.trips.length>1?'Viaje '+(ti+1)+' · ':'')+'sale '+fHM(t.depart)+'</h3>'+
      '<div>Lleva <b>'+t.load+(d.id==='cenco'?' jaulas':' de '+CUR.cap+' bolsones')+'</b> · '+fKm(t.dist)+' · ~'+fMin(t.drive)+' manejando</div>'+
      '<div class="load" role="img" aria-label="'+Math.round(pct)+'% de la capacidad"><i style="width:'+pct.toFixed(0)+'%;background:'+t.color+'"></i></div>';
    var base=CUR.trips.slice(0,ti).reduce(function(a,x){return a+x.stops.length;},0);
    t.stops.forEach(function(s,k){var p=P[s.i];
      h+='<div class="leg">'+fKm(s.legD)+' · '+fMin(s.legT)+'</div><div class="stop"><div class="num" style="background:'+(p.t==='PV'?'#2e8b3a':'#1f5fb4')+'">'+(base+k+1)+'</div>'+
        '<div><div class="t">'+esc(p.n)+'</div><div class="s">'+esc(p.a)+'</div><div class="q">Retirar '+pl(s.q,'bolsón',unitOf(s.i))+' · llega ~'+fHM(s.arrive)+'</div></div>'+
        '<div class="noprint"><a class="btn sm blue" href="'+waze(s.i)+'" target="_blank" rel="noopener">Waze</a></div></div>';});
    h+='<div class="leg">'+fKm(t.backD)+' · '+fMin(t.backT)+'</div><div class="stop"><div class="num home">⌂</div><div><div class="t">Vuelta al Centro Verde</div><div class="q" style="color:var(--ink-3)">llega ~'+fHM(t.ret)+'</div></div><div class="noprint"><a class="btn sm blue" href="'+waze(0)+'" target="_blank" rel="noopener">Waze</a></div></div>';
    var parts=gmapsParts(t);
    h+='<div class="btns noprint" style="margin-top:8px">'+parts.map(function(u,k){return '<a class="btn go sm" href="'+esc(u)+'" target="_blank" rel="noopener">Abrir en Google Maps'+(parts.length>1?' (parte '+(k+1)+')':'')+'</a>';}).join('')+'</div></div>';
  });
  h+='<div class="btns noprint" style="margin-top:6px"><button class="btn go" type="button" data-r="wa">Mandar por WhatsApp</button><button class="btn" type="button" data-r="copy">Copiar texto</button><button class="btn" type="button" data-r="print">Imprimir hoja</button></div>';
  h+='<p class="hint" style="margin-top:10px">Tiempos de camión = auto × '+String(DEF.fact).replace('.',',')+' + '+S.p.stop+' min por parada (30 en Terminal, Feria y CENCOSUD). Distancias por calle (OpenStreetMap). Sin tránsito.</p></div>';
  el.innerHTML=h;drawMap();
}

/* ---------- Eventos ---------- */
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button[data-d]');if(!b)return;S.day=b.getAttribute('data-d');save();renderTabs();renderCfg();run();var a=document.querySelector('#tabs [aria-pressed=true]');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'center'});});
$('#gens').addEventListener('click',function(e){
  if(e.target.id==='addBtn'){var v=$('#addSel').value;if(!v){toast('Elegí un lugar de la lista');return;}var i=+v;var L2=S.extra[S.day]||[];if(L2.indexOf(i)<0)L2.push(i);S.extra[S.day]=L2;save();renderCfg();run();toast(P[i].n+' agregado al '+day().n);return;}
  var b=e.target.closest('button[data-a]');if(!b)return;
  if(b.getAttribute('data-a')==='rm'){var ri=+b.closest('[data-i]').getAttribute('data-i');S.extra[S.day]=(S.extra[S.day]||[]).filter(function(x){return x!==ri;});delete S.bags[S.day+':'+ri];save();renderCfg();run();return;}var i=+b.closest('[data-i]').getAttribute('data-i');setBags(i,bagsOf(i)+(b.getAttribute('data-a')==='up'?1:-1));renderCfg();});
$('#gens').addEventListener('change',function(e){if(e.target.tagName!=='INPUT')return;var i=+e.target.closest('[data-i]').getAttribute('data-i');setBags(i,parseInt(e.target.value,10)||0);renderCfg();});
['pCap','pStop','pUnload'].forEach(function(id){$('#'+id).addEventListener('change',function(e){var k={pCap:'cap',pStop:'stop',pUnload:'unload'}[id];S.p[k]=Math.max(id==='pCap'?1:0,parseInt(e.target.value,10)||0);save();});});
$('#pStart').addEventListener('change',function(e){S.p.start=e.target.value||DEF.start;save();});
$('#btnPlan').addEventListener('click',function(){run();var r=$('#result');if(r.scrollIntoView&&window.innerWidth<900)r.scrollIntoView({behavior:'smooth'});});
$('#btnReset').addEventListener('click',function(){var d=day();stopsOf().forEach(function(i){delete S.bags[S.day+':'+i];});S.extra[S.day]=[];S.p={cap:DEF.cap,start:DEF.start,stop:DEF.stop,unload:DEF.unload};save();renderCfg();run();toast('Valores de la planilla restaurados');});
$('#result').addEventListener('click',async function(e){var b=e.target.closest('button[data-r]');if(!b)return;var a=b.getAttribute('data-r');
  if(a==='wa')window.open('https://wa.me/?text='+encodeURIComponent(dayText()),'_blank','noopener');
  else if(a==='copy')toast((await copy(dayText()))?'Copiado':'No se pudo copiar');
  else if(a==='print')window.print();});

window.addEventListener('resize',function(){clearTimeout(window.__rz);window.__rz=setTimeout(function(){map.invalidateSize();},200);});
window.addEventListener('orientationchange',function(){setTimeout(function(){map.invalidateSize();},300);});
renderTabs();renderCfg();run();setTimeout(function(){map.invalidateSize();drawMap();},250);
})();
</script>
</body>
</html>
